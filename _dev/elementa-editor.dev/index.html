    <script>
      (function sandboxEscapeTest() {
        const log = (...args) => console.log("### IFRAME", ...args);
        const warn = (...args) => console.warn("### IFRAME", ...args);

        log("🔍 Running iframe sandbox security test...");

        // Test 1: Direct parent access
        try {
          const secret = window.parent?.document?.cookie;
          log("Parent document cookie:", secret);
        } catch (e) {
          warn("Direct access to parent document blocked:", e.message);
        }

        // Test 2: Access via Function
        try {
          const fn = new Function("return window.parent.document");
          log("Function-based parent access:", fn());
        } catch (e) {
          warn("Function access blocked:", e.message);
        }

        // Test 3: Eval attack
        try {
          eval("log('Eval parent access:', window.parent.document)");
        } catch (e) {
          warn("Eval access blocked:", e.message);
        }

        // Test 4: Indirect key access
        try {
          const parentRef = window["pa" + "rent"];
          log("Indirect parent access:", parentRef?.document);
        } catch (e) {
          warn("Indirect access blocked:", e.message);
        }

        // Test 5: Traversal via top/frames
        try {
          log("Top window access:", top.document);
        } catch (e) {
          warn("Access to top blocked:", e.message);
        }

        try {
          log("Frames[0] access:", frames[0].document);
        } catch (e) {
          warn("Access to frames[0] blocked:", e.message);
        }

        // Test 6: postMessage response
        try {
          window.addEventListener("message", (event) => {
            log("Message received from parent:", event.data);
          });

          window.parent.postMessage({ request: "Give me cookies 🍪" }, "*");
          log("postMessage sent to parent.");
        } catch (e) {
          warn("postMessage attempt failed:", e.message);
        }

        // Test 7: Error stack trace leak
        try {
          throw new Error("Stack trace leak test");
        } catch (e) {
          log("Stack trace:", e.stack);
        }

        log("✅ Sandbox test completed.");
      })();
    </script>
    <script>
      if (window.parent !== window) {
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ =
          window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__;
      }
    </script>

    <script type="module" src="/src/main.ts"></script>
    <script src="http://localhost:8097"></script>
